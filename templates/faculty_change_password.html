<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #d97706;
            margin-bottom: 10px;
        }

        .faculty-info {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #d97706;
        }

        .btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background: #d97706;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .btn:hover {
            background: #b45309;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 18px;

            text-align: center;
        }

        .success {
            background: #dcfce7;
            color: #166534;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 18px;

            text-align: center;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🔐 Change Password</h1>

    <div class="faculty-info">

        {% if faculty_name %}
            {{ faculty_name }}
        {% endif %}

        {% if faculty_code %}
            <br>
            Faculty ID: {{ faculty_code }}
        {% endif %}

    </div>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    {% if success %}

        <div class="success">
            {{ success }}
        </div>

    {% endif %}


    <form
        method="POST"
        action="{{ url_for('faculty_change_password') }}"
    >

        <div class="form-group">

            <label for="current_password">
                Current Password
            </label>

            <input
                type="password"
                id="current_password"
                name="current_password"
                placeholder="Enter current password"
                required
            >

        </div>


        <div class="form-group">

            <label for="new_password">
                New Password
            </label>

            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter new password"
                minlength="6"
                required
            >

        </div>


        <div class="form-group">

            <label for="confirm_password">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm new password"
                minlength="6"
                required
            >

        </div>


        <button
            type="submit"
            class="btn"
        >
            Change Password
        </button>

    </form>


    <a
        href="{{ url_for('faculty_dashboard') }}"
        class="back"
    >
        ← Back to Faculty Dashboard
    </a>

</div>

</body>

</html>
