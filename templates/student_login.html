<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 380px;

            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #198754;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #198754;
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            margin-top: 25px;

            border: none;

            border-radius: 5px;

            background: #198754;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #146c43;
        }

        .info {
            margin-top: 20px;

            padding: 12px;

            background: #f0f8f4;

            border-radius: 5px;

            text-align: center;

            font-size: 13px;

            color: #555;
        }

        .error {
            margin-bottom: 20px;

            padding: 12px;

            background: #fee2e2;

            color: #b91c1c;

            border-radius: 5px;

            text-align: center;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #198754;

            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


    <div class="login-container">


        <h1>
            Student Login
        </h1>


        <p class="subtitle">
            College Examination Cell
        </p>


        <!-- ERROR MESSAGE -->

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form
            method="POST"
            action="{{ url_for('student_login') }}"
        >


            <label for="register_number">
                Register Number
            </label>


            <input
                type="text"
                id="register_number"
                name="register_number"
                placeholder="Enter your Register Number"
                required
                autocomplete="off"
            >


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>


        </form>


        <div class="info">

            Login using your registered
            examination Register Number.

        </div>


        <a
            href="/"
            class="back"
        >
            ← Back to Home
        </a>


    </div>


</body>

</html>
