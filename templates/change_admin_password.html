<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Admin Password</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#222}
.box{max-width:450px;margin:70px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.1)}
h2{text-align:center;color:#173b7a;margin-bottom:25px}
label{display:block;margin:14px 0 6px;font-weight:bold}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{width:100%;margin-top:22px;padding:12px;background:#173b7a;color:#fff;border:0;border-radius:6px;font-size:16px;cursor:pointer}
button:hover{background:#102d5f}
.error{background:#ffe8e8;color:#a00;padding:10px;border-radius:6px;margin-bottom:15px}
.success{background:#e8f8ed;color:#176b35;padding:10px;border-radius:6px;margin-bottom:15px}
a{display:block;text-align:center;margin-top:18px;color:#173b7a;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h2>🔐 Change Admin Password</h2>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
{% if success %}<div class="success">{{ success }}</div>{% endif %}
<form method="POST">
<label>Current Password</label>
<input type="password" name="current_password" required>
<label>New Password</label>
<input type="password" name="new_password" minlength="6" required>
<label>Confirm New Password</label>
<input type="password" name="confirm_password" minlength="6" required>
<button type="submit">Change Password</button>
</form>
<a href="{{ url_for('admin_dashboard') }}">← Back to Admin Dashboard</a>
</div>
</body>
</html>
