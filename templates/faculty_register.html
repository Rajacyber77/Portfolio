<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Faculty Registration</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #173b7a;
            color: white;

            padding: 20px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            margin-top: 5px;
            font-size: 14px;
        }

        .back {
            color: white;
            text-decoration: none;

            border: 1px solid white;

            padding: 9px 15px;

            border-radius: 5px;
        }

        .back:hover {
            background: white;
            color: #173b7a;
        }

        .container {
            max-width: 600px;

            margin: 45px auto;

            padding: 0 20px;
        }

        .title {
            text-align: center;

            color: #173b7a;

            margin-bottom: 25px;
        }

        .box {
            background: white;

            padding: 30px;

            border-radius: 10px;

            border: 1px solid #ddd;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.06);
        }

        label {
            display: block;

            font-weight: bold;

            margin-top: 15px;

            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;

            background: white;
        }

        input:focus,
        select:focus {
            outline: none;

            border-color: #173b7a;
        }

        .register-btn {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 5px;

            background: #173b7a;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .register-btn:hover {
            background: #102d5f;
        }

        .error {
            background: #ffe6e6;

            color: #b00020;

            padding: 12px;

            border-radius: 5px;

            margin-bottom: 15px;

            text-align: center;
        }

        .login-link {
            text-align: center;

            margin-top: 20px;
        }

        .login-link a {
            color: #173b7a;

            font-weight: bold;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 50px;

            background: #173b7a;

            color: white;

            text-align: center;

            padding: 18px;
        }

    </style>

</head>


<body>


<!-- ==========================================
     HEADER
     ========================================== -->

<header>

    <div>

        <h1>
            Faculty Registration
        </h1>

        <p>
            College Examination Cell
        </p>

    </div>


    <a
        href="/"
        class="back"
    >
        ← Home
    </a>

</header>


<!-- ==========================================
     MAIN
     ========================================== -->

<div class="container">

    <h2 class="title">
        Create Faculty Account
    </h2>


    <div class="box">


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="/faculty-register"
        >


            <!-- ==================================
                 FACULTY NAME
                 ================================== -->

            <label for="name">
                Faculty Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter faculty name"
                required
            >


            <!-- ==================================
                 DEPARTMENT
                 ================================== -->

            <label for="department">
                Department
            </label>

            <select
                id="department"
                name="department"
                required
            >

                <option value="">
                    Select Department
                </option>


                {% for department in departments %}

                <option
                    value="{{ department.department_name }}"
                >
                    {{ department.department_name }}
                </option>

                {% endfor %}

            </select>


            <!-- ==================================
                 COURSE
                 ================================== -->

            <label for="course">
                Course
            </label>

            <select
                id="course"
                name="course"
                required
            >

                <option value="">
                    Select Course
                </option>


                {% for department in departments %}

                <option
                    value="{{ department.course_name }}"
                    data-department="{{ department.department_name }}"
                    style="display:none;"
                >
                    {{ department.course_name }}
                </option>

                {% endfor %}

            </select>


            
            <!-- ==================================
                 USERNAME
                 ================================== -->

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Create username"
                required
            >


            <!-- ==================================
                 PASSWORD
                 ================================== -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create password"
                required
            >


            <!-- ==================================
                 CONFIRM PASSWORD
                 ================================== -->

            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm password"
                required
            >


            <!-- ==================================
                 REGISTER BUTTON
                 ================================== -->

            <button
                type="submit"
                class="register-btn"
            >
                Create Faculty Account
            </button>


        </form>


        <!-- LOGIN -->

        <div class="login-link">

            Already have an account?

            <a href="/faculty-login">
                Faculty Login
            </a>

        </div>


    </div>

</div>


<!-- ==========================================
     FOOTER
     ========================================== -->

<footer>

    <p>
        © 2026 College Examination Cell
    </p>

</footer>


<!-- ==========================================
     DEPARTMENT → COURSE SCRIPT
     ========================================== -->

<script>

const departmentSelect =
    document.getElementById("department");

const courseSelect =
    document.getElementById("course");


departmentSelect.addEventListener(
    "change",
    function () {

        const selectedDepartment =
            this.value;

        const options =
            courseSelect.querySelectorAll(
                "option[data-department]"
            );


        // Reset course

        courseSelect.value = "";


        // Show only selected department courses

        options.forEach(
            function (option) {

                if (
                    option.dataset.department ===
                    selectedDepartment
                ) {

                    option.style.display =
                        "block";

                } else {

                    option.style.display =
                        "none";

                }

            }
        );

    }
);

</script>


</body>

</html>
