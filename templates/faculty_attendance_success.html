<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Submitted</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .success-box {
            width: 90%;
            max-width: 500px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            text-align: center;

            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #166534;
            margin-bottom: 12px;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        .loading {
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }

    </style>

</head>


<body>

<div class="success-box">

    <div class="icon">
        ✅
    </div>

    <h1>
        Attendance Submitted Successfully
    </h1>

    <p>
        {{ saved }} attendance record(s) submitted successfully.
    </p>

    <div class="loading">
        Redirecting to Dashboard...
    </div>

</div>


<script>

    /*
     * Wait briefly so the success message is visible.
     *
     * replace() removes this success page from the
     * browser history.
     */

    setTimeout(function () {

        window.location.replace(
            "{{ url_for('faculty_dashboard') }}"
        );

    }, 1500);

</script>


</body>

</html>
