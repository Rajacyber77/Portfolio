<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Faculty Timetable Upload</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;

            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #d97706;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .upload-btn {
            width: 100%;

            margin-top: 20px;

            padding: 13px;

            border: none;
            border-radius: 5px;

            background: #d97706;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .upload-btn:hover {
            background: #b45309;
        }

        .view-btn {
            display: block;

            width: 100%;

            margin-top: 15px;

            padding: 13px;

            background: #2563eb;

            color: white;

            text-align: center;

            text-decoration: none;

            border-radius: 5px;

            font-size: 16px;

            font-weight: bold;
        }

        .view-btn:hover {
            background: #1d4ed8;
        }

        .success {
            margin-bottom: 20px;

            padding: 12px;

            background: #dcfce7;

            color: #166534;

            border-radius: 5px;

            text-align: center;
        }

        .error {
            margin-bottom: 20px;

            padding: 12px;

            background: #fee2e2;

            color: #b91c1c;

            border-radius: 5px;

            text-align: center;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #d97706;

            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


    <div class="container">


        <h1>
            Faculty Timetable
        </h1>


        <p class="subtitle">
            Upload Faculty Examination Timetable
        </p>


        {% if success %}

        <div class="success">
            {{ success }}
        </div>

        {% endif %}


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <!-- UPLOAD FORM -->

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            <label for="timetable_file">
                Select Timetable
            </label>

            <input
                type="file"
                id="timetable_file"
                name="timetable_file"
                accept=".xlsx,.xls,.pdf"
                required
            >

            <button
                type="submit"
                class="upload-btn"
            >
                Upload Timetable
            </button>

        </form>


        <!-- VIEW TIMETABLES -->

        <a
            href="{{ url_for('faculty_timetables') }}"
            class="view-btn"
        >
            View Uploaded Timetables
        </a>


        <!-- BACK -->

        <a
            href="{{ url_for('faculty_dashboard') }}"
            class="back"
        >
            ← Back to Faculty Dashboard
        </a>


    </div>


</body>

</html>
